<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" />
    <style>
      /* The page around the module, not the module: its own stylesheet lives in its shadow root. */
      :root {
        --page-bg: oklch(0.984 0.003 248); --page-surface: oklch(1 0 0); --page-ink: oklch(0.21 0.035 255);
        --page-muted: oklch(0.5 0.035 257); --page-line: oklch(0.922 0.013 255); --page-focus: oklch(0.55 0.17 254);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page-bg: oklch(0.18 0.022 255); --page-surface: oklch(0.218 0.024 255); --page-ink: oklch(0.962 0.006 250);
          --page-muted: oklch(0.76 0.02 255); --page-line: oklch(1 0 0 / 11%); --page-focus: oklch(0.74 0.13 248);
          color-scheme: dark;
        }
      }
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; background: var(--page-bg); color: var(--page-ink);
        font: 13px/20px 'Geist', ui-sans-serif, system-ui, sans-serif; }
      .demo-bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; min-height: 48px; padding: 8px 16px; box-sizing: border-box;
        background: var(--page-surface); border-bottom: 1px solid var(--page-line); }
      .demo-bar[hidden] { display: none; }
      .demo-bar label { display: inline-flex; align-items: center; gap: 8px; color: var(--page-muted); font-size: 12px; font-weight: 500; }
      .demo-bar select { height: 32px; max-width: 220px; padding: 0 8px; border: 1px solid color-mix(in oklab, var(--page-line), var(--page-ink) 40%);
        border-radius: 8px; background: var(--page-surface); color: var(--page-ink); font: inherit; font-size: 13px; }
      .demo-bar select:focus-visible { outline: 2px solid var(--page-focus); outline-offset: 2px; }
      .demo-nav { display: inline-flex; align-items: center; gap: 4px; }
      .demo-nav a { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 1px solid transparent;
        border-radius: 8px; color: var(--page-muted); font-size: 13px; font-weight: 500; text-decoration: none; }
      .demo-nav a:hover { color: var(--page-ink); border-color: var(--page-line); }
      .demo-nav a[aria-current='page'] { color: var(--page-ink); background: var(--page-bg); border-color: var(--page-line); }
      .demo-nav a:focus-visible { outline: 2px solid var(--page-focus); outline-offset: 2px; }
      #root { position: relative; flex: 1; min-height: 0; }
    </style>
  </head>
  <body>
    <div class="demo-bar" id="demo-bar" hidden>
      <nav class="demo-nav">
        <a href="/?demo" data-nav="mywork"></a>
        <a href="/projects?demo" data-nav="projects"></a>
      </nav>
      <label><span id="persona-label"></span> <select id="persona"></select></label>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
